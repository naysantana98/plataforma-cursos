<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
<div class="auth-box">
<a class="brand" href="index.html">Academia<span>Online</span></a>
<h1>Criar sua conta</h1><p class="muted-text">A conta será usada para acessar sua área de aluno.</p>
<form id="registerForm">
<label>Nome<input id="name" required></label>
<label>E-mail<input id="email" type="email" required></label>
<label>Senha<input id="password" type="password" minlength="6" required></label>
<button class="btn full" type="submit">Criar conta</button>
<div id="message" class="message"></div>
</form>
<p>Já possui conta? <a href="login.html">Entrar</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/auth.js"></script>
</body></html>
