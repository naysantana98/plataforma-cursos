<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Gerenciar curso</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

  <a class="brand" href="index.html">
    Academia<span>Online</span>
  </a>

  <nav>
    <a href="admin.html">Admin</a>

    <button
      id="logout"
      class="btn btn-outline"
      type="button"
    >
      Sair
    </button>
  </nav>

</header>


<main class="dashboard">

  <div id="course"></div>


  <section class="admin-grid">

    <!-- MÓDULOS -->

    <div class="panel">

      <h2>Novo módulo</h2>

      <form id="moduleForm">

        <input
          id="moduleTitle"
          placeholder="Nome do módulo"
          required
        >

        <button
          class="btn"
          type="submit"
        >
          Adicionar módulo
        </button>

      </form>


      <div id="modules"></div>

    </div>


    <!-- AULAS -->

    <div class="panel">

      <h2>Nova aula</h2>

      <form id="lessonForm">

        <select
          id="moduleSelect"
          required
        ></select>


        <input
          id="lessonTitle"
          placeholder="Título da aula"
          required
        >


        <textarea
          id="lessonDescription"
          placeholder="Descrição"
        ></textarea>


        <input
          id="videoUrl"
          placeholder="URL do vídeo"
        >


        <input
          id="materialUrl"
          placeholder="URL do material"
        >


        <input
          id="duration"
          type="number"
          min="0"
          placeholder="Duração em minutos"
        >


        <button
          class="btn"
          type="submit"
        >
          Adicionar aula
        </button>

      </form>

    </div>

  </section>


  <div
    id="message"
    class="message"
  ></div>

</main>


<!-- =================================
     MODAL EDITAR MÓDULO
================================= -->

<div
  id="editModuleModal"
  class="modal"
  style="display:none;"
>

  <div class="modal-content">

    <div class="modal-header">

      <div>
        <span class="eyebrow">
          MÓDULO
        </span>

        <h2>
          Editar módulo
        </h2>
      </div>


      <button
        id="closeModuleModal"
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>


    <form id="editModuleForm">

      <input
        id="editModuleId"
        type="hidden"
      >


      <label class="form-label">
        Nome do módulo
      </label>

      <input
        id="editModuleTitle"
        required
      >


      <div class="modal-actions">

        <button
          id="cancelModuleEdit"
          class="btn btn-outline"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn"
          type="submit"
        >
          Salvar alterações
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =================================
     MODAL EDITAR AULA
================================= -->

<div
  id="editLessonModal"
  class="modal"
  style="display:none;"
>

  <div class="modal-content edit-modal-content">

    <div class="modal-header">

      <div>

        <span class="eyebrow">
          AULA
        </span>

        <h2>
          Editar aula
        </h2>

      </div>


      <button
        id="closeLessonModal"
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>


    <form id="editLessonForm">

      <input
        id="editLessonId"
        type="hidden"
      >


      <label class="form-label">
        Módulo
      </label>

      <select
        id="editLessonModule"
        required
      ></select>


      <label class="form-label">
        Título da aula
      </label>

      <input
        id="editLessonTitle"
        required
      >


      <label class="form-label">
        Descrição
      </label>

      <textarea
        id="editLessonDescription"
        rows="4"
      ></textarea>


      <label class="form-label">
        URL do vídeo
      </label>

      <input
        id="editVideoUrl"
      >


      <label class="form-label">
        URL do material
      </label>

      <input
        id="editMaterialUrl"
      >


      <label class="form-label">
        Duração em minutos
      </label>

      <input
        id="editDuration"
        type="number"
        min="0"
      >


      <label class="publish-option">

        <input
          id="editPublished"
          type="checkbox"
        >

        <span>
          Aula publicada
        </span>

      </label>


      <div class="modal-actions">

        <button
          id="cancelLessonEdit"
          class="btn btn-outline"
          type="button"
        >
          Cancelar
        </button>

        <button
          class="btn"
          type="submit"
        >
          Salvar alterações
        </button>

      </div>

    </form>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/admin-curso.js"></script>

</body>

</html>
